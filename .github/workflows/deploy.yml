name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Create deployment directory
        run: mkdir -p gh-pages
      
      - name: Copy static files
        run: |
          cp public/index.html gh-pages/
          cp public/solar-system.html gh-pages/
      
      - name: Create 404 page
        run: |
          cat > gh-pages/404.html << 'EOL'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Page Not Found - Solar System Visualizer</title>
            <style>
              body {
                font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
                background-color: #0d1117;
                color: #f0f6fc;
                margin: 0;
                padding: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100vh;
                text-align: center;
              }
              h1 {
                font-size: 2.5rem;
                margin-bottom: 1rem;
                background: linear-gradient(to right, #58a6ff, #bc8cff);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
              }
              p {
                margin-bottom: 2rem;
                font-size: 1.25rem;
                max-width: 600px;
              }
              .button {
                background: #238636;
                color: white;
                padding: 0.75rem 1.5rem;
                border-radius: 0.375rem;
                text-decoration: none;
                font-weight: 600;
                transition: background-color 0.2s;
              }
              .button:hover {
                background: #2ea043;
              }
            </style>
          </head>
          <body>
            <h1>404 - Page Not Found</h1>
            <p>The solar system is vast, and it seems you've drifted into uncharted space.</p>
            <a href="/" class="button">Return to Home</a>
          </body>
          </html>
          EOL
      
      - name: Create .nojekyll file
        run: touch gh-pages/.nojekyll
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages