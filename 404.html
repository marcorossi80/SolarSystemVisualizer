<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Solar System Visualizer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #050505;
        color: #ffffff;
        text-align: center;
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      
      .container {
        max-width: 500px;
        padding: 20px;
      }
      
      h1 {
        color: #FDB813;
        margin-bottom: 10px;
      }
      
      p {
        font-size: 18px;
        opacity: 0.8;
        margin-bottom: 30px;
      }
      
      .loading {
        display: inline-block;
        width: 50px;
        height: 50px;
        border: 3px solid rgba(255,255,255,.3);
        border-radius: 50%;
        border-top-color: #FDB813;
        animation: spin 1s ease-in-out infinite;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <div class="container">
      <h1>Solar System Visualizer</h1>
      <p>Redirecting to the application...</p>
      <div class="loading"></div>
    </div>
    <noscript>
      <p style="color: #ff6b6b;">This application requires JavaScript to run. Please enable JavaScript in your browser settings.</p>
    </noscript>
  </body>
</html>
